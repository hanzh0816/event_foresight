# Frozen-Predictor future supervision of E2; 300-step matched pilot.
data:
  root: /data3/hzh/DSEC
  manifest: configs/event_samples.json
  image_size:
  - 448
  - 896
  sample_history_frames: 40
  context_frames: 4
  tolerance_us: 1000
  event_window_us: 50000
  event_bins: 5
  batch_size: 1
  num_workers: 2
  alignment_val_samples: 24
model:
  dinof_checkpoint: checkpoints/dinof.pt
  detector_checkpoint: checkpoints/detector.pt
  predictor_checkpoint: null
  event_encoder_checkpoint: checkpoints/event/e2_7500.pt
optimization:
  epochs: 100
  max_steps: 300
  accumulation_steps: 2
  lr: 1.0e-05
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.01
  scheduler: constant
  clip_grad: 1.0
  gradient_checkpointing: true
  activation_checkpointing: true
  current_scope: all
  current_weight: 1.0
  future_weight: 1.0
runtime:
  seed: 42
  precision: bf16-mixed
  encoder_chunk_size: 1
  cpu_threads: 4
  log_every: 10
