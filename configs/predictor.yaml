# B1: RGB baseline. All model comparisons share this budget and detection head.
data:
  root: /data3/hzh/DSEC
  image_size: [448, 896]
  sample_history_frames: 40
  context_frames: 4
  frame_interval_s: 0.05
  train_stride: 1
  val_stride: 1
  test_stride: 1
  tolerance_us: 1000
  horizontal_flip_prob: 0.5
  batch_size: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 1

model:
  encoder_checkpoint: /data3/hzh/models/dino_world/dinov2_vitb14_reg4_pretrain.pth
  predictor_checkpoint: null
  rgb_checkpoint: null
  detector_checkpoint: outputs/v31_detector/checkpoints/best.ckpt
  event:
    enabled: false
  predictor:
    hidden_dim: 768
    depth: 8
    heads: 12
    mlp_ratio: 4.0
    dropout: 0.0
    drop_path: 0.0
    query_chunk_size: 512

optimization:
  epochs: 40
  max_steps: -1
  accumulation_steps: 8
  lr: 0.0001
  event_lr: 0.0002
  finetune_lr: 0.00002
  fusion_lr: 0.0001
  finetune_event_lr: 0.0001
  weight_decay: 0.05
  betas: [0.9, 0.95]
  scheduler: cosine
  warmup_fraction: 0.05
  min_lr: 0.000001
  clip_grad: 1.0
  predictor_dropout: true
  smooth_l1_beta: 1.0
  align_weight: 0.0
  align_cosine_weight: 0.2
  activation_checkpointing: true

runtime:
  seed: 42
  precision: bf16-mixed
  encoder_chunk_size: 1
  cpu_threads: 4
  log_every: 10
