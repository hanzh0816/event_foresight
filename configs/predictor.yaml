# DINO-world paper-based predictor, trained from scratch on frozen DINOv2 features.
data:
  root: /data3/hzh/DSEC
  image_size: [448, 896]
  sample_history_frames: 40
  context_frames: 4
  frame_interval_s: 0.05 # Fixed by the existing DSEC +50ms protocol.
  train_stride: 1
  val_stride: 1
  tolerance_us: 1000
  batch_size: 1 # Per GPU; global batch = batch_size * visible GPUs * accumulation_steps.
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 1

model:
  encoder_checkpoint: /data3/hzh/models/dino_world/dinov2_vitb14_reg4_pretrain.pth
  predictor_checkpoint: null # Random predictor initialization; encoder is pretrained.
  predictor:
    hidden_dim: 768
    depth: 12
    heads: 12
    mlp_ratio: 4.0
    dropout: 0.0
    query_chunk_size: 1024 # Independent queries; 0 disables chunking.

optimization:
  epochs: 40
  max_steps: -1 # Full configured epochs; no automatic run is started.
  accumulation_steps: 8
  lr: 0.0001
  weight_decay: 0.4
  scheduler: warmup_constant
  warmup_steps: 5000 # Paper recipe; adjust deliberately to the DSEC training budget.
  clip_grad: 1.0
  predictor_dropout: true
  smooth_l1_beta: 0.1
  activation_checkpointing: true

runtime:
  seed: 42
  precision: bf16-mixed
  encoder_chunk_size: 1
  cpu_threads: 4
  log_every: 10
