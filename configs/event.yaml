# E2: full Event Encoder alignment; official RGB Predictor and Detector stay fixed.
data:
  root: /data3/hzh/DSEC
  manifest: configs/event_samples.json
  image_size: [448, 896]
  sample_history_frames: 40
  context_frames: 4
  tolerance_us: 1000
  event_window_us: 50000
  event_bins: 5
  batch_size: 2
  num_workers: 4
  alignment_val_samples: 96

model:
  dinof_checkpoint: checkpoints/dinof.pt
  detector_checkpoint: checkpoints/detector.pt
  predictor_checkpoint: null
  event_encoder_checkpoint: null # RGB initialization; --init-from starts from trained E2.

optimization:
  epochs: 100
  max_steps: 7500
  accumulation_steps: 2 # Two visible GPUs -> effective batch 8, matching E2.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.01
  scheduler: constant
  clip_grad: 1.0
  gradient_checkpointing: false

runtime:
  seed: 42
  precision: bf16-mixed
  encoder_chunk_size: 1
  cpu_threads: 4
  log_every: 10
