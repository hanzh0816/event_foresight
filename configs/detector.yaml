# Train one shared detection head on real frozen DINO features.
extends: predictor.yaml
data:
  batch_size: 4
  num_workers: 4
model:
  detector_checkpoint: null

detector:
  hidden_dim: 256
  num_classes: 8
  num_queries: 300
  num_levels: 4
  encoder_layers: 6
  decoder_layers: 6
  heads: 8
  points: 4
  mlp_dim: 1024
  dropout: 0.1

loss:
  class_weight: 2.0
  bbox_weight: 5.0
  giou_weight: 2.0
  alpha: 0.25
  gamma: 2.0

optimization:
  accumulation_steps: 1
