# M2: historical Event-RGB fusion with active-region alignment.
extends: predictor.yaml
output_dir: outputs/v31_m2
data:
  event_bins: 10
  event_activity_threshold: 1
model:
  event:
    enabled: true
    in_channels: 20
    input_size: [512, 1024]
    channels: [48, 96, 192, 384]
    output_stride: 16
  predictor:
    gate_init: 0.1
    event_layers: [1, 2, 3, 4, 5, 6, 7, 8]
optimization:
  align_weight: 0.1
